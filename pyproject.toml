[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-rubric"
version = "0.1.0"
description = "Evaluate qualitative research quality across saturation, bias, and evidence dimensions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
nlp = ["scikit-learn>=1.3"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini = ["google-generativeai>=0.5"]
all = ["research-rubric[nlp,openai,anthropic,gemini]"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "scikit-learn>=1.3",
]

[project.scripts]
research-rubric = "research_rubric.cli:cli"

[tool.setuptools.packages.find]
include = ["research_rubric*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
